[project]
name = "persian-invoice"
version = "0.1.0"
description = "Extract line items from Persian grocery receipts using a local vision LLM"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0",
  "ollama>=0.3.3",
  "opencv-python-headless>=4.9",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
